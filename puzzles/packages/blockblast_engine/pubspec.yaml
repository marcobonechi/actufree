name: blockblast_engine
description: "Pure-Dart Block Blast rules: board, shapes, placement, line clearing, scoring and dealing. No Flutter imports."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.13.1

resolution: workspace

# puzzle_store is pure Dart with no dependencies of its own, so implementing
# its SavedGame contract keeps this package as far from Flutter as ever.
dependencies:
  puzzle_store:
    path: ../puzzle_store

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
